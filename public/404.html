<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Redirigiendo…</title>
  <script>
    // GitHub Pages SPA fallback: reenvía la ruta solicitada a index.html
    (function () {
      var path = window.location.pathname;
      var base = path.substring(0, path.lastIndexOf('/') + 1);
      window.location.replace(base + 'index.html?p=' + encodeURIComponent(path));
    })();
  </script>
</head>
<body>
  <p>Redirigiendo…</p>
</body>
</html>
